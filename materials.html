<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대방수원2차 자재 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --blue-950:#0c1c30;
    --blue-900:#122a45;
    --blue-800:#1a3a5c;
    --paper:#f6f3ea;
    --paper-dim:#ece7d8;
    --orange:#e85d1f;
    --orange-dim:#c94c17;
    --ink:#16232f;
    --ink-dim:#5c6b78;
    --teal:#2d7a7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--blue-950);
    font-family:'Inter',sans-serif; color:var(--ink); padding: 20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:18px; padding: 4px 4px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.18);
  }
  .brand-eyebrow{
    font-family:'Roboto Mono',monospace; font-size:11px; letter-spacing:.14em;
    color: rgba(255,255,255,0.55); text-transform:uppercase; margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;
    color:#fdfaf3; margin:0; letter-spacing:-.01em;
  }
  .tag{
    font-family:'Roboto Mono',monospace; font-size:11px; color:var(--orange);
    background: rgba(232,93,31,0.14); border:1px solid rgba(232,93,31,0.4);
    padding:4px 9px; border-radius:3px; white-space:nowrap;
  }

  .panel{
    background:var(--paper); border-radius:10px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.08) inset;
    padding:20px 18px; margin-bottom:16px; position:relative;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:16px; bottom:16px; width:3px;
    background:var(--orange); border-radius:0 3px 3px 0;
  }
  .panel-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
    color:var(--ink); margin:0 0 14px 2px; display:flex; align-items:center; gap:8px;
    justify-content:space-between;
  }
  .panel-title .num{
    font-family:'Roboto Mono',monospace; font-size:11px; color:#fff; background:var(--blue-800);
    width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;
  }

  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:11px; font-weight:600; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  select, input[type=date], input[type=number], input[type=text]{
    width:100%; padding:10px 11px; border-radius:6px; border:1.5px solid #d8d2bf;
    background:#fffdf8; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
    appearance:none; -webkit-appearance:none;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235c6b78' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:30px;
  }
  select:focus, input:focus{outline:2px solid var(--orange); outline-offset:1px; border-color:var(--orange);}

  .item-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;
  }
  .item-field{
    background:#fffdf8; border:1.5px solid #d8d2bf; border-radius:7px; padding:8px 10px;
  }
  .item-field label{
    display:block; font-size:11.5px; font-weight:600; color:var(--ink); margin-bottom:4px;
  }
  .item-field input{
    border:none; padding:0; font-family:'Roboto Mono',monospace; font-weight:700; font-size:16px;
    background:transparent; width:100%;
  }
  .item-field input:focus{outline:none;}
  .item-field select{
    border:none; padding:0 16px 0 0; font-family:'Roboto Mono',monospace; font-weight:700; font-size:16px;
    background:transparent; width:100%; color:var(--ink); background-image:none;
  }
  .item-field select:focus{outline:none;}
  .item-field .unit{
    font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-dim); margin-left:2px;
  }

  .addbtn{
    margin-top:6px; width:100%; padding:13px; border:none; border-radius:7px;
    background:var(--orange); color:#fff; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:14.5px; cursor:pointer; letter-spacing:.01em;
  }
  .addbtn:hover{background:var(--orange-dim);}
  .addbtn:disabled{background:#c9c2ae; cursor:not-allowed;}

  .refresh-btn{
    font-family:'Roboto Mono',monospace; font-size:11px; font-weight:600; color:var(--ink-dim);
    background:var(--paper-dim); border:1px solid #d8d2bf; border-radius:5px; padding:5px 10px;
    cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  }
  .refresh-btn:hover{background:#e2dcc7;}
  .refresh-btn.spinning .ic{animation: spin 0.6s linear;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .export-btn{
    font-family:'Roboto Mono',monospace; font-size:11px; font-weight:600; color:#fff;
    background:var(--blue-800); border:none; border-radius:4px; padding:5px 10px;
    cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  }
  .export-btn:hover{background:var(--blue-900);}
  .export-btn:disabled{background:#c9c2ae; cursor:not-allowed;}

  .last-sync{
    font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--ink-dim);
    text-align:right; margin: -8px 2px 12px;
  }

  .item-summary{
    margin-bottom:14px; background:var(--paper-dim); border-radius:8px; padding:4px 12px;
  }
  .m-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid #ddd6c3;
  }
  .m-row:last-child{border-bottom:none;}
  .m-row .name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; color:var(--ink); }
  .m-row .amt{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:14px; color:var(--orange-dim); }

  .loc-group{ margin-bottom:4px; }
  .loc-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px 6px; border-bottom:1.5px solid var(--ink);
  }
  .loc-header .name{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:var(--ink);
  }
  .loc-header .date{
    font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--orange-dim); font-weight:600;
  }
  .loc-items{
    display:flex; flex-wrap:wrap; gap:6px; padding:9px 4px 14px;
  }
  .loc-chip{
    display:flex; align-items:center; gap:6px; background:var(--paper-dim);
    border-radius:14px; padding:5px 10px 5px 12px; font-size:12.5px;
  }
  .loc-chip .n{ font-weight:600; color:var(--ink); }
  .loc-chip .q{ font-family:'Roboto Mono',monospace; font-weight:700; color:var(--orange-dim); }
  .loc-chip .del{
    border:none; background:none; color:#b8ac93; cursor:pointer; font-size:13px; line-height:1; padding:2px;
  }
  .loc-chip .del:hover{ color:var(--orange); }

  .empty-state{ text-align:center; padding:26px 10px; color:var(--ink-dim); font-size:13px; }

  .foot-note{
    text-align:center; font-size:11px; color:rgba(255,255,255,0.35); margin-top:18px;
    font-family:'Roboto Mono',monospace;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand-eyebrow">대방수원2차 · 안전시설 현장</div>
      <h1>자재 현황 기록</h1>
    </div>
    <div class="tag">팀 공유 · 실시간</div>
  </header>

  <div class="panel">
    <p class="panel-title"><span class="num">1</span>자재 입력</p>

    <div class="row2">
      <div class="field">
        <label for="f-date">날짜</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label for="f-dong">동</label>
        <select id="f-dong"></select>
      </div>
    </div>
    <div class="field">
      <label for="f-floor">층</label>
      <select id="f-floor"></select>
    </div>

    <div class="field">
      <label>수량 입력 (0개는 자동으로 무시됩니다)</label>
      <div class="item-grid" id="item-grid"></div>
    </div>

    <div class="field" id="zone-field">
      <label for="f-zonefloor">전용망 위치 (해당 동에 있는 경우만 선택)</label>
      <select id="f-zonefloor"><option value="">선택 안 함</option></select>
    </div>

    <button class="addbtn" id="add-btn">+ 자재 현황 목록에 추가</button>
  </div>

  <div class="panel">
    <p class="panel-title">
      <span style="display:flex;align-items:center;gap:8px;"><span class="num">2</span>자재 현황 목록</span>
      <span style="display:flex;gap:8px;">
        <button class="export-btn" id="export-btn">⬇ 엑셀</button>
        <button class="refresh-btn" id="refresh-btn"><span class="ic">↻</span>새로고침</button>
      </span>
    </p>
    <div class="last-sync" id="last-sync">불러오는 중…</div>

    <div id="item-summary" class="item-summary" style="display:none;"></div>

    <div id="loc-list">
      <div class="empty-state">아직 등록된 자재가 없습니다.</div>
    </div>
  </div>

  <div class="foot-note">팀원 누구나 입력·조회 가능 · 30초마다 자동 갱신</div>
</div>

const MATERIAL_ITEMS = [
  { name: '세대망',   unit: '층', step: 1,  max: 10 },
  { name: '거실창',   unit: '장', step: 1,  max: 10 },
  { name: '실외기창', unit: '장', step: 1,  max: 10 },
  { name: '다용도실', unit: '층', step: 1,  max: 10 },
  { name: 'D링',      unit: '개', step: 10, max: 200 },
  { name: '스크류볼트', unit: '개', step: 50, max: 500 },
  { name: '라쳇',     unit: '개', step: 1,  max: 100 },
  { name: 'EV망',     unit: '층', multiFloor: true }
];
const DATA = JSON.parse(document.getElementById('sheet-data').textContent);
const sheetKeys = Object.keys(DATA);
const ALL_DONGS = ['201','202','203','204','205','206','207','208','209','210','211','212','213','214','215','216','217'];

let materials = [];
let constructionEntries = []; // 계산기 쪽 시공 목록 (읽기 전용, 최근 설치층 추천용)
let initialFloorSuggestionApplied = false;

const dateInput = document.getElementById('f-date');
const dongSel = document.getElementById('f-dong');
const floorInput = document.getElementById('f-floor');
const zoneFloorSel = document.getElementById('f-zonefloor');
const itemGrid = document.getElementById('item-grid');
const addBtn = document.getElementById('add-btn');
const locList = document.getElementById('loc-list');
const itemSummaryEl = document.getElementById('item-summary');
const refreshBtn = document.getElementById('refresh-btn');
const exportBtn = document.getElementById('export-btn');
const lastSync = document.getElementById('last-sync');

const INNER_WALL_DONGS = new Set(['201','202','203','204','205','209','210','211']);

function populateDongs(){
  dongSel.innerHTML = ALL_DONGS.map(d => {
    const wallType = INNER_WALL_DONGS.has(d) ? '내벽' : '맞벽';
    return `<option value="${d}">${d}동(${wallType})</option>`;
  }).join('');
}

// 계산기와 동일하게: 선택된 동에서 5개 항목(시트) 전체를 합쳐 존재하는 층만 표시
function populateFloors(){
  const dong = dongSel.value;
  const floorSet = new Set();
  sheetKeys.forEach(k => {
    const dongData = DATA[k].grid[dong];
    if(dongData) Object.keys(dongData).forEach(f => floorSet.add(f));
  });
  const floors = Array.from(floorSet).sort((a,b)=>Number(b)-Number(a));
  if(floors.length === 0){
    floorInput.innerHTML = `<option value="">데이터 없음</option>`;
  } else {
    floorInput.innerHTML = floors.map(f => `<option value="${f}">${f}층</option>`).join('');
  }
  populateZoneFloors(floors);
  populateMultiFloorSelects();
}

// 전용망 위치용 층 선택 목록 (동일 동의 실제 층 데이터 기준, 선택 안 함 포함)
function populateZoneFloors(floors){
  zoneFloorSel.innerHTML = `<option value="">선택 안 함</option>` +
    floors.map(f => `<option value="${f}">${f}층</option>`).join('');
}

// 계산기와 동일한 규칙: 실제 시공 날짜 기준으로 가장 최근 설치층 + 1층을 추천
function getSuggestedNextFloor(dong){
  const candidates = constructionEntries.filter(e => e.type === 'install' && e.dong === dong);
  if(candidates.length === 0) return null;
  const mostRecent = candidates.reduce((best, cur) => {
    if(!best) return cur;
    const curDate = cur.date || '';
    const bestDate = best.date || '';
    if(curDate > bestDate) return cur;
    if(curDate === bestDate && Number(cur.floor) > Number(best.floor)) return cur;
    return best;
  }, null);
  return String(Number(mostRecent.floor) + 1);
}

function applyFloorSuggestion(){
  const suggested = getSuggestedNextFloor(dongSel.value);
  if(suggested && [...floorInput.options].some(o => o.value === suggested)){
    floorInput.value = suggested;
  }
}

function populateItemGrid(){
  itemGrid.innerHTML = MATERIAL_ITEMS.map((it, i) => {
    if(it.multiFloor){
      return `
      <div class="item-field" style="grid-column:1/-1;">
        <label>${it.name} <span style="font-weight:500;color:var(--ink-dim);">(몇 층 설치분 · 복수선택 가능)</span></label>
        <select id="qty-${i}" multiple size="6" style="width:100%;font-family:'Roboto Mono',monospace;font-size:13px;padding:4px;"></select>
      </div>
    `;
    }
    const optionCount = Math.floor(it.max / it.step);
    const options = ['<option value="0">0</option>'];
    for(let n = 1; n <= optionCount; n++){
      const v = n * it.step;
      options.push(`<option value="${v}">${v}${it.unit}</option>`);
    }
    return `
    <div class="item-field">
      <label>${it.name} <span style="font-weight:500;color:var(--ink-dim);">(${it.step}${it.unit} 단위)</span></label>
      <select id="qty-${i}">${options.join('')}</select>
    </div>
  `;
  }).join('');
  populateMultiFloorSelects();
}

// EV망 등 '복수 층 선택' 항목의 옵션을 현재 동의 실제 층 데이터로 채움
function populateMultiFloorSelects(){
  const dong = dongSel.value;
  const floorSet = new Set();
  sheetKeys.forEach(k => {
    const dongData = DATA[k].grid[dong];
    if(dongData) Object.keys(dongData).forEach(f => floorSet.add(f));
  });
  const floors = Array.from(floorSet).sort((a,b)=>Number(b)-Number(a));
  MATERIAL_ITEMS.forEach((it, i) => {
    if(!it.multiFloor) return;
    const sel = document.getElementById(`qty-${i}`);
    if(!sel) return;
    const prevSelected = new Set([...sel.selectedOptions].map(o => o.value));
    sel.innerHTML = floors.map(f => `<option value="${f}"${prevSelected.has(f) ? ' selected' : ''}>${f}층</option>`).join('');
  });
}

function mdLabel(dateStr){
  if(!dateStr) return '날짜 미기재';
  const parts = dateStr.split('-');
  if(parts.length === 3) return `${Number(parts[1])}/${Number(parts[2])}`;
  return dateStr;
}

function renderItemSummary(){
  if(materials.length === 0){ itemSummaryEl.style.display = 'none'; itemSummaryEl.innerHTML=''; return; }
  const totals = {};
  MATERIAL_ITEMS.forEach(it => totals[it.name] = 0);
  let zoneCount = 0;
  materials.forEach(m => {
    if(m.isLocation){ zoneCount += 1; return; }
    totals[m.item] = (totals[m.item]||0) + m.qty;
  });
  itemSummaryEl.style.display = 'block';
  itemSummaryEl.innerHTML =
    `<div class="m-row" style="border-bottom:1px solid #ddd6c3;padding-bottom:8px;margin-bottom:2px;"><span class="name" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;">항목별 총 수량</span></div>` +
    MATERIAL_ITEMS.filter(it => totals[it.name] > 0).map(it =>
      `<div class="m-row"><span class="name">${it.name}</span><span class="amt">${totals[it.name].toLocaleString('ko-KR')}${it.unit}</span></div>`
    ).join('') +
    (zoneCount > 0 ? `<div class="m-row"><span class="name">전용망 위치 등록</span><span class="amt">${zoneCount.toLocaleString('ko-KR')}곳</span></div>` : '');
}

function renderLocList(){
  if(materials.length === 0){
    locList.innerHTML = `<div class="empty-state">아직 등록된 자재가 없습니다.</div>`;
    exportBtn.disabled = true;
    return;
  }
  exportBtn.disabled = false;

  // 동/층별로 그룹핑, 동 오름차순 -> 층 내림차순, 최신 항목이 위로 오도록 등록 역순 그룹 정렬
  const groups = {};
  const order = [];
  materials.forEach((m, i) => {
    const key = `${m.dong}__${m.floor}`;
    if(!groups[key]){ groups[key] = { dong:m.dong, floor:m.floor, rows:[], latestDate:m.date||'' }; order.push(key); }
    groups[key].rows.push({ m, i });
    if((m.date||'') > groups[key].latestDate) groups[key].latestDate = m.date||'';
  });
  order.sort((a,b) => {
    const ga = groups[a], gb = groups[b];
    if(gb.latestDate !== ga.latestDate) return gb.latestDate.localeCompare(ga.latestDate);
    return 0;
  });

  locList.innerHTML = order.map(key => {
    const g = groups[key];
    const chips = g.rows.map(({m, i}) => {
      const qtyLabel = m.isLocation ? '위치' : `${m.qty}개`;
      return `
      <div class="loc-chip">
        <span class="n">${m.item}</span><span class="q">${qtyLabel}</span>
        <button class="del" data-idx="${i}" title="삭제">✕</button>
      </div>
    `;
    }).join('');
    return `<div class="loc-group">
      <div class="loc-header">
        <span class="name">${g.dong}동 ${g.floor}층</span>
        <span class="date">${mdLabel(g.latestDate)}</span>
      </div>
      <div class="loc-items">${chips}</div>
    </div>`;
  }).join('');
}

function renderAll(){
  renderItemSummary();
  renderLocList();
}

async function loadMaterials(showSpin){
  if(showSpin) refreshBtn.classList.add('spinning');
  try{
    const res = await fetch(`${JSONBIN_BASE}/latest?t=${Date.now()}`, {
      cache: 'no-store',
      headers: { 'X-Master-Key': JSONBIN_API_KEY, 'Cache-Control': 'no-cache' }
    });
    const data = await res.json();
    materials = (data && data.record && Array.isArray(data.record.materials)) ? data.record.materials : [];
  }catch(e){
    materials = [];
  }
  try{
    const res2 = await fetch(`${CONSTRUCTION_BASE}/latest?t=${Date.now()}`, {
      cache: 'no-store',
      headers: { 'X-Master-Key': JSONBIN_API_KEY, 'Cache-Control': 'no-cache' }
    });
    const data2 = await res2.json();
    constructionEntries = (data2 && data2.record && Array.isArray(data2.record.entries)) ? data2.record.entries : [];
  }catch(e){
    constructionEntries = [];
  }
  renderAll();
  const now = new Date();
  lastSync.textContent = `마지막 갱신 · ${now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}`;
  if(showSpin) setTimeout(() => refreshBtn.classList.remove('spinning'), 400);
  if(!initialFloorSuggestionApplied){
    initialFloorSuggestionApplied = true;
    applyFloorSuggestion();
  }
}

async function saveMaterials(){
  try{
    // 이제 자재현황 전용 저장소라 다른 데이터와 병합할 필요 없이 바로 저장
    await fetch(JSONBIN_BASE, {
      method: 'PUT',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
      body: JSON.stringify({ materials })
    });
  }catch(e){ /* best effort */ }
}

addBtn.addEventListener('click', () => {
  const date = dateInput.value;
  const dong = dongSel.value;
  const floor = floorInput.value;
  if(!floor){ alert('층을 선택해주세요.'); return; }

  const newEntries = [];
  MATERIAL_ITEMS.forEach((it, i) => {
    const input = document.getElementById(`qty-${i}`);
    if(it.multiFloor){
      const selectedFloors = [...input.selectedOptions].map(o => o.value);
      selectedFloors.forEach(f => {
        newEntries.push({ date, dong, floor: f, item: it.name, qty: 1, isLocation: true });
      });
      return;
    }
    const qty = Number(input.value) || 0;
    if(qty > 0){
      newEntries.push({ date, dong, floor, item: it.name, qty });
    }
  });

  const zoneFloor = zoneFloorSel.value;
  if(zoneFloor){
    newEntries.push({ date, dong, floor: zoneFloor, item: '전용망', qty: 1, isLocation: true });
  }

  if(newEntries.length === 0){ alert('수량을 하나 이상 입력하거나 전용망 위치를 선택해주세요.'); return; }

  materials.unshift(...newEntries);
  renderAll();
  saveMaterials();

  // 입력창 초기화 (동/층/날짜는 유지)
  MATERIAL_ITEMS.forEach((it, i) => {
    const input = document.getElementById(`qty-${i}`);
    if(it.multiFloor){
      [...input.options].forEach(o => o.selected = false);
    } else {
      input.value = '0';
    }
  });
  zoneFloorSel.value = '';
});

locList.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.del');
  if(!btn) return;
  if(!confirm('삭제하시겠습니까?')) return;
  const idx = Number(btn.dataset.idx);
  materials.splice(idx, 1);
  renderAll();
  saveMaterials();
});

refreshBtn.addEventListener('click', () => loadMaterials(true));

exportBtn.addEventListener('click', () => {
  if(materials.length === 0 || typeof XLSX === 'undefined') return;
  const rows = materials.map(m => ({
    '날짜': m.date || '', '동': m.dong + '동', '층': m.floor + '층', '항목': m.item, '수량': m.qty
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [ {wch:11}, {wch:7}, {wch:7}, {wch:16}, {wch:8} ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '자재현황');
  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `대방수원2차_자재현황_${today}.xlsx`);
});

// init
populateDongs();
populateFloors();
populateItemGrid();
dateInput.value = new Date().toISOString().slice(0,10);

dongSel.addEventListener('change', () => {
  populateFloors();
  applyFloorSuggestion();
});

loadMaterials(false);
setInterval(() => loadMaterials(false), 30000);
</script>
</body>
