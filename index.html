<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대방수원2차 물량 시공 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --blue-950:#0c1c30;
    --blue-900:#122a45;
    --blue-800:#1a3a5c;
    --blue-line: rgba(255,255,255,0.09);
    --paper:#f6f3ea;
    --paper-dim:#ece7d8;
    --orange:#e85d1f;
    --orange-dim:#c94c17;
    --ink:#16232f;
    --ink-dim:#5c6b78;
    --ok:#2f8f5b;
    --teal:#2d7a7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: var(--blue-950);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding: 20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:18px; padding: 4px 4px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.18);
  }
  .brand-eyebrow{
    font-family:'Roboto Mono',monospace; font-size:11px; letter-spacing:.14em;
    color: rgba(255,255,255,0.55); text-transform:uppercase; margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;
    color:#fdfaf3; margin:0; letter-spacing:-.01em;
  }
  .tag{
    font-family:'Roboto Mono',monospace; font-size:11px; color:var(--orange);
    background: rgba(232,93,31,0.14); border:1px solid rgba(232,93,31,0.4);
    padding:4px 9px; border-radius:3px; white-space:nowrap;
  }

  .panel{
    background:var(--paper);
    border-radius:10px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.08) inset;
    padding:20px 18px;
    margin-bottom:16px;
    position:relative;
  }
  .panel::before{
    content:"";
    position:absolute; left:0; top:16px; bottom:16px; width:3px;
    background:var(--orange); border-radius:0 3px 3px 0;
  }
  .panel-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
    color:var(--ink); margin:0 0 14px 2px; display:flex; align-items:center; gap:8px;
  }
  .panel-title .num{
    font-family:'Roboto Mono',monospace; font-size:11px; color:#fff; background:var(--blue-800);
    width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;
  }

  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:11px; font-weight:600; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  select, input[type=date], input[type=number]{
    width:100%; padding:10px 11px; border-radius:6px; border:1.5px solid #d8d2bf;
    background:#fffdf8; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
    appearance:none; -webkit-appearance:none;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235c6b78' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:30px;
  }
  select:focus, input:focus{outline:2px solid var(--orange); outline-offset:1px; border-color:var(--orange);}
  select:disabled{color:#a9a190; background:#efeadd;}

  .floor-chips{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:6px;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .floor-chip{
    padding:9px 4px; text-align:center; border-radius:6px; border:1.5px solid #d8d2bf;
    background:#fffdf8; font-family:'Roboto Mono',monospace; font-size:12.5px; font-weight:600;
    color:var(--ink-dim); cursor:pointer; transition:background .1s ease, color .1s ease, border-color .1s ease;
  }
  .floor-chip.selected{
    background:var(--teal); border-color:var(--teal); color:#fff;
  }
  .floor-chip.na{
    color:#c7bfa8; background:#efeadd; cursor:not-allowed;
  }
  .floor-chip-summary{
    margin-top:8px; font-family:'Roboto Mono',monospace; font-size:11.5px; color:var(--ink-dim);
  }

  /* segmented control for 구분 */
  .seg{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .seg button{
    padding:10px 8px; border-radius:6px; border:1.5px solid #d8d2bf; background:#fffdf8;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; color:var(--ink-dim);
    cursor:pointer; transition:all .12s ease;
  }
  .seg button.active[data-type="install"]{
    background:var(--orange); border-color:var(--orange); color:#fff;
  }
  .seg button.active[data-type="dismantle"]{
    background:var(--teal); border-color:var(--teal); color:#fff;
  }

  .price-note{
    margin-top:6px; font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-dim);
    display:flex; align-items:center; gap:6px;
  }
  .price-note .badge{
    font-size:10px; padding:2px 6px; border-radius:3px; background:var(--paper-dim); color:var(--ink-dim);
    border:1px solid #d8d2bf;
  }
  .price-note .badge.special{ background:rgba(232,93,31,0.14); color:var(--orange-dim); border-color:rgba(232,93,31,0.4); }

  .breakdown{
    margin-top:16px; background:var(--blue-950); border-radius:8px; padding:6px 14px;
  }
  .b-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .b-row:last-of-type{border-bottom:none;}
  .b-row .name{
    font-size:12.5px; color:rgba(255,255,255,0.75); flex:1;
  }
  .b-row .area{
    font-family:'Roboto Mono',monospace; font-size:11.5px; color:rgba(255,255,255,0.4);
    white-space:nowrap;
  }
  .b-row .amt{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; color:#fdfaf3;
    white-space:nowrap; min-width:82px; text-align:right;
  }
  .b-row.na .name, .b-row.na .amt{color:rgba(255,255,255,0.28);}
  .b-total{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 0 8px; margin-top:2px; border-top:2px solid var(--orange);
  }
  .b-total .label{
    font-family:'Roboto Mono',monospace; font-size:11px; color:var(--orange);
    letter-spacing:.06em; text-transform:uppercase;
  }
  .b-total .amt{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; color:#fdfaf3;
  }

  .addbtn{
    margin-top:14px; width:100%; padding:13px; border:none; border-radius:7px;
    background:var(--orange); color:#fff; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:14.5px; cursor:pointer; letter-spacing:.01em;
    transition:background .15s ease, transform .1s ease;
  }
  .addbtn:hover{background:var(--orange-dim);}
  .addbtn:active{transform:scale(0.99);}
  .addbtn:disabled{background:#c9c2ae; cursor:not-allowed;}
  .addbtn.dismantle{background:var(--teal);}
  .addbtn.dismantle:hover{background:#245f5f;}

  .log-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; padding:0 2px;
  }
  .log-head .panel-title{margin:0;}
  .clear-link{
    font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-dim);
    background:none; border:none; text-decoration:underline; cursor:pointer; padding:0;
  }
  .clear-link:hover{color:var(--orange-dim);}

  .log-actions{display:flex; align-items:center; gap:14px;}

  .export-btn{
    font-family:'Roboto Mono',monospace; font-size:11px; font-weight:600; color:#fff;
    background:var(--blue-800); border:none; border-radius:4px; padding:5px 10px;
    cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  }
  .export-btn:hover{background:var(--blue-900);}
  .export-btn:disabled{background:#c9c2ae; cursor:not-allowed;}

  .entry{
    display:flex; align-items:center; gap:10px; padding:11px 4px;
    border-bottom:1px dashed #d8d2bf;
  }
  .entry:last-child{border-bottom:none;}
  .entry .info{flex:1; min-width:0;}
  .entry .line1{
    font-family:'Roboto Mono',monospace; font-size:11.5px; color:var(--ink-dim);
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:2px; align-items:center;
  }
  .entry .line1 .dt{color:var(--orange-dim); font-weight:600;}
  .entry .line1 .month-badge{
    font-size:9.5px; padding:1px 6px; border-radius:8px; font-weight:600;
    background:var(--blue-800); color:#fff;
  }
  .entry .line1 .type-badge{
    font-size:9.5px; padding:1px 6px; border-radius:8px; font-weight:600;
    background:rgba(232,93,31,0.14); color:var(--orange-dim);
  }
  .entry .line1 .type-badge.dismantle{background:rgba(45,122,122,0.16); color:var(--teal);}
  .entry .line2{font-size:13.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry .amt{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--ink);
    white-space:nowrap;
  }
  .entry .del{
    border:none; background:none; color:#b8ac93; cursor:pointer; font-size:16px; line-height:1;
    padding:4px 2px; flex-shrink:0;
  }
  .entry .del:hover{color:var(--orange);}

  .empty-state{
    text-align:center; padding:26px 10px; color:var(--ink-dim); font-size:13px;
  }

  .type-section-header{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:var(--ink);
    padding:4px 4px 8px; display:flex; align-items:center; gap:8px;
  }
  .type-section-header .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);}
  .type-section-header.dismantle .dot{background:var(--teal);}
  .type-section-total{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 4px 18px; margin-top:2px;
  }
  .type-section-total .label{
    font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-dim); letter-spacing:.05em;
  }
  .type-section-total .amt{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--orange-dim);
  }

  .group-header{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; color:var(--orange-dim);
    padding:12px 4px 4px; text-transform:none;
  }
  .group-header:first-child{padding-top:2px;}
  .group-subtotal{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 4px 10px; margin-bottom:2px; border-bottom:2px solid #ddd6c3;
  }
  .group-subtotal .label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--ink-dim); letter-spacing:.04em;
  }
  .group-subtotal .amt{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink);
  }

  .month-summary{
    margin-bottom:14px; background:var(--paper-dim); border-radius:8px; padding:4px 12px;
  }
  .m-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid #ddd6c3;
  }
  .m-row:last-child{border-bottom:none;}
  .m-row .name{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; color:var(--ink);
    display:flex; align-items:center; gap:6px;
  }
  .m-row .name .period{
    font-family:'Roboto Mono',monospace; font-weight:500; font-size:10.5px; color:var(--ink-dim);
  }
  .m-row .amt{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:var(--orange-dim);
  }

  .total-bar{
    margin-top:4px; padding-top:14px; border-top:2px solid var(--ink);
    display:flex; align-items:center; justify-content:space-between;
  }
  .total-bar .label{font-family:'Roboto Mono',monospace; font-size:12px; color:var(--ink-dim); letter-spacing:.05em;}
  .total-bar .value{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:var(--orange-dim);}

  .foot-note{
    text-align:center; font-size:11px; color:rgba(255,255,255,0.35); margin-top:18px;
    font-family:'Roboto Mono',monospace;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand-eyebrow">대방수원2차 · 안전시설 물량표</div>
      <h1>물량 시공 계산기</h1>
    </div>
    <div class="tag">설치·해체 단가 자동 적용</div>
  </header>

  <div class="panel">
    <p class="panel-title"><span class="num">1</span>동 · 층 · 구분 입력</p>

    <div class="field">
      <label>구분</label>
      <div class="seg" id="type-seg">
        <button type="button" data-type="install" class="active">설치</button>
        <button type="button" data-type="dismantle">해체</button>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-date">작업일</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label for="f-price">단가 (원/m²)</label>
        <input type="number" id="f-price" value="1800" step="10" min="0">
        <div class="price-note" id="price-note"></div>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-dong">동</label>
        <select id="f-dong"></select>
      </div>
      <div class="field" id="floor-select-field">
        <label for="f-floor">층</label>
        <select id="f-floor"></select>
      </div>
    </div>

    <div class="field" id="sheet-field" style="display:none;">
      <label for="f-sheet">해체 항목 (시트별 개별 계산)</label>
      <select id="f-sheet"></select>
    </div>

    <div class="field" id="floor-chips-field" style="display:none;">
      <label>층 선택 <span style="text-transform:none;font-weight:500;color:var(--ink-dim);">· 드래그해서 여러 층 한번에 선택</span></label>
      <div class="floor-chips" id="floor-chips"></div>
    </div>

    <div class="breakdown" id="breakdown"></div>

    <button class="addbtn" id="add-btn">+ 이 동·층 전체 항목 시공 목록에 추가</button>
  </div>

  <div class="panel">
    <div class="log-head">
      <p class="panel-title"><span class="num">2</span>시공 목록 <span style="font-family:'Roboto Mono',monospace;font-size:10px;font-weight:500;color:var(--ink-dim);text-transform:none;letter-spacing:0;">· 링크를 아는 모두와 공유됨</span></p>
      <div class="log-actions">
        <button class="export-btn" id="export-btn">⬇ 엑셀로 내보내기</button>
        <button class="clear-link" id="clear-btn">전체 삭제</button>
      </div>
    </div>
    <div id="month-summary" class="month-summary" style="display:none;"></div>
    <div id="item-summary" class="month-summary" style="display:none;"></div>
    <div id="log-list">
      <div class="empty-state">아직 추가된 작업이 없습니다.</div>
    </div>
    <div class="total-bar">
      <div class="label">TOTAL</div>
      <div class="value" id="total-value">0원</div>
    </div>
  </div>

  <div class="foot-note">설치: 205·206·207·214·215·216·217동 2,000원 / 그 외 동 1,800원 · 해체: 전동 500원 · 시공월: 매달 21일~다음달 20일 기준</div>

<script>
const DATA = JSON.parse(document.getElementById('sheet-data').textContent);
const sheetKeys = Object.keys(DATA);
const shortTitle = (key) => DATA[key].title.replace(/\s*\(단위:.*?\)\s*/,'');

// pricing rules
const SPECIAL_DONGS = ['205','206','207','214','215','216','217'];
const PRICE_INSTALL_SPECIAL = 2000;
const PRICE_INSTALL_NORMAL = 1800;
const PRICE_DISMANTLE = 500;

function rulePrice(dong, type){
  if(type === 'dismantle') return PRICE_DISMANTLE;
  return SPECIAL_DONGS.includes(dong) ? PRICE_INSTALL_SPECIAL : PRICE_INSTALL_NORMAL;
}

// 시공 기간: 매달 21일 ~ 다음달 20일이 "다음달" 시공월로 묶임 (예: 7/21~8/20 -> 8월)
function settlementInfo(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  let y = d.getFullYear();
  let m = d.getMonth() + 1;
  const day = d.getDate();
  if(day >= 21){
    m += 1;
    if(m > 12){ m = 1; y += 1; }
  }
  const key = `${y}-${String(m).padStart(2,'0')}`;
  const prevM = m === 1 ? 12 : m - 1;
  const prevY = m === 1 ? y - 1 : y;
  const period = `${prevM}/21~${m}/20`;
  return { key, label: `${m}월`, period };
}

// union of all dongs across every sheet
const allDongsSet = new Set();
sheetKeys.forEach(k => Object.keys(DATA[k].grid).forEach(d => allDongsSet.add(d)));
const allDongs = Array.from(allDongsSet).sort((a,b)=>Number(a)-Number(b));

const dongSel = document.getElementById('f-dong');
const floorSel = document.getElementById('f-floor');
const priceInput = document.getElementById('f-price');
const priceNote = document.getElementById('price-note');
const dateInput = document.getElementById('f-date');
const addBtn = document.getElementById('add-btn');
const breakdown = document.getElementById('breakdown');
const logList = document.getElementById('log-list');
const totalValue = document.getElementById('total-value');
const clearBtn = document.getElementById('clear-btn');
const exportBtn = document.getElementById('export-btn');
const typeSeg = document.getElementById('type-seg');
const sheetField = document.getElementById('sheet-field');
const sheetSel = document.getElementById('f-sheet');
const floorSelectField = document.getElementById('floor-select-field');
const floorChipsField = document.getElementById('floor-chips-field');
const floorChipsEl = document.getElementById('floor-chips');

let currentType = 'install';
let priceManuallyEdited = false;
let selectedFloors = new Set();

function populateSheetOptions(){
  sheetSel.innerHTML = sheetKeys.map(k => `<option value="${k}">${shortTitle(k)}</option>`).join('');
}

function populateDongs(){
  dongSel.innerHTML = allDongs.map(d => `<option value="${d}">${d}동</option>`).join('');
}

function getInstallDate(dong, floor){
  const found = entries.find(e => e.type === 'install' && e.dong === dong && e.floor === floor);
  return found ? found.date : null;
}

function populateFloors(){
  const floorSet = new Set();
  sheetKeys.forEach(k => {
    const dongData = DATA[k].grid[dongSel.value];
    if(dongData) Object.keys(dongData).forEach(f => floorSet.add(f));
  });
  const floors = Array.from(floorSet).sort((a,b)=>Number(b)-Number(a));
  if(floors.length === 0){
    floorSel.innerHTML = `<option value="">데이터 없음</option>`;
    floorSel.disabled = true;
  } else {
    floorSel.disabled = false;
    const prevValue = floorSel.value;
    floorSel.innerHTML = floors.map(f => {
      const installDate = getInstallDate(dongSel.value, f);
      const suffix = installDate ? ` (${mdLabel(installDate)} 설치)` : '';
      return `<option value="${f}">${f}층${suffix}</option>`;
    }).join('');
    if(floors.includes(prevValue)) floorSel.value = prevValue;
  }
}

function fmt(n){
  return n.toLocaleString('ko-KR', {maximumFractionDigits: 2});
}
function fmtWon(n){
  return Math.round(n).toLocaleString('ko-KR') + '원';
}

function applyRulePrice(){
  const p = rulePrice(dongSel.value, currentType);
  priceInput.value = p;
  priceManuallyEdited = false;
  updatePriceNote();
}

function updatePriceNote(){
  if(currentType === 'dismantle'){
    priceNote.innerHTML = `<span class="badge">해체 · 전동 공통 500원</span>`;
  } else {
    const special = SPECIAL_DONGS.includes(dongSel.value);
    priceNote.innerHTML = special
      ? `<span class="badge special">${dongSel.value}동 설치 특수단가 2,000원</span>`
      : `<span class="badge">설치 일반단가 1,800원</span>`;
  }
}

// 소수점 둘째 자리까지 있는 면적값은 소수 첫째 자리로 올림 처리 (예: 55.56 -> 55.6, 39.98 -> 40)
function normalizeArea(v, sheetKey){
  if(typeof v !== 'number') return v;
  const isYeonchang = sheetKey && sheetKey.includes('연창');
  if(isYeonchang){
    return Math.round(v * 100) / 100; // 연창: 소수점 둘째 자리까지 유지
  }
  const fixed2 = Math.round(v * 100) / 100; // 부동소수점 오차 제거
  const hundredths = Math.round((fixed2 * 100) % 10);
  if(hundredths !== 0){
    return Math.ceil(fixed2 * 10) / 10; // 나머지: 소수점 첫째 자리로 올림
  }
  return fixed2;
}

function currentItems(){
  const dong = dongSel.value;
  // 해체: 시트(항목) 1개 + 선택된 층(들) 각각
  if(currentType === 'dismantle'){
    const k = sheetSel.value;
    const dongData = DATA[k].grid[dong] || {};
    const floors = Array.from(selectedFloors).sort((a,b)=>Number(b)-Number(a));
    return floors.map(floor => {
      const v = dongData[floor];
      return { key: k, title: shortTitle(k), floor, area: (typeof v === 'number') ? normalizeArea(v, k) : null };
    });
  }
  // 설치: 5개 항목 전체 합산 (층 1개)
  const floor = floorSel.value;
  return sheetKeys.map(k => {
    const dongData = DATA[k].grid[dong] || {};
    const v = dongData[floor];
    return { key: k, title: shortTitle(k), floor, area: (typeof v === 'number') ? normalizeArea(v, k) : null };
  });
}

function getDismantledFloors(sheetKey, dong){
  const done = new Set();
  entries.forEach(e => {
    if(e.type === 'dismantle' && e.sheetKey === sheetKey && e.dong === dong) done.add(e.floor);
  });
  return done;
}

// 그리드에 5개씩 채워지는 순서를 ㄹ자(지그재그)로 재배열
// (홀수 번째 줄은 뒤집어서, 화면상 좌→우, 우→좌가 번갈아 나오게 함)
function zigzagOrder(list, cols){
  const rows = [];
  for(let i = 0; i < list.length; i += cols) rows.push(list.slice(i, i + cols));
  rows.forEach((row, idx) => { if(idx % 2 === 1) row.reverse(); });
  return rows.flat();
}

function populateFloorChips(){
  const dong = dongSel.value;
  const k = sheetSel.value;
  const dongData = (DATA[k] && DATA[k].grid[dong]) || {};
  const floors = Object.keys(dongData).sort((a,b)=>Number(b)-Number(a));
  const dismantledFloors = getDismantledFloors(k, dong);
  // 선택된 층 중 이제 유효하지 않거나 이미 해체완료된 것 제거
  selectedFloors = new Set(Array.from(selectedFloors).filter(f => floors.includes(f) && !dismantledFloors.has(f)));

  if(floors.length === 0){
    floorChipsEl.innerHTML = `<div style="grid-column:1/-1;color:rgba(255,255,255,0.3);font-size:12px;padding:4px 0;">이 동에는 데이터가 없습니다</div>`;
    return;
  }
  const ordered = zigzagOrder(floors, 5);
  floorChipsEl.innerHTML = ordered.map(f => {
    if(dismantledFloors.has(f)){
      return `<div class="floor-chip na" title="이미 해체 완료됨">${f}F</div>`;
    }
    const sel = selectedFloors.has(f) ? ' selected' : '';
    return `<div class="floor-chip${sel}" data-floor="${f}">${f}F</div>`;
  }).join('');
}

function updateBreakdown(){
  const items = currentItems();
  const price = Number(priceInput.value) || 0;
  const valid = items.filter(it => it.area !== null);

  if(currentType === 'dismantle'){
    if(items.length === 0){
      breakdown.innerHTML = `<div class="b-row na"><span class="name">층을 선택하세요</span></div>`;
    } else {
      breakdown.innerHTML = items.map(it => {
        if(it.area === null){
          return `<div class="b-row na"><span class="name">${it.floor}층</span><span class="amt">데이터 없음</span></div>`;
        }
        return `<div class="b-row">
          <span class="name">${it.floor}층</span>
          <span class="area">${fmt(it.area)}m²</span>
          <span class="amt">${fmtWon(it.area * price)}</span>
        </div>`;
      }).join('') + `<div class="b-total"><span class="label">합계</span><span class="amt">${fmtWon(valid.reduce((s,it)=>s+it.area*price,0))}</span></div>`;
    }
  } else {
    breakdown.innerHTML = items.map(it => {
      if(it.area === null){
        return `<div class="b-row na"><span class="name">${it.title}</span><span class="amt">데이터 없음</span></div>`;
      }
      return `<div class="b-row">
        <span class="name">${it.title}</span>
        <span class="area">${fmt(it.area)}m²</span>
        <span class="amt">${fmtWon(it.area * price)}</span>
      </div>`;
    }).join('') + `<div class="b-total"><span class="label">합계</span><span class="amt">${fmtWon(valid.reduce((s,it)=>s+it.area*price,0))}</span></div>`;
  }

  addBtn.disabled = valid.length === 0;
  addBtn.classList.toggle('dismantle', currentType === 'dismantle');
  addBtn.textContent = (currentType === 'dismantle' ? '+ 선택한 층 해체비 시공 목록에 추가' : '+ 이 동·층 전체 항목 시공 목록에 추가');
}

typeSeg.addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-type]');
  if(!btn) return;
  currentType = btn.dataset.type;
  [...typeSeg.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b === btn));
  const isDismantle = currentType === 'dismantle';
  sheetField.style.display = isDismantle ? 'block' : 'none';
  floorSelectField.style.display = isDismantle ? 'none' : 'block';
  floorChipsField.style.display = isDismantle ? 'block' : 'none';
  if(isDismantle) populateFloorChips();
  applyRulePrice();
  updateBreakdown();
});

// 해당 동에서 가장 최근에 설치/해체된 층 바로 위층을 추천
function getSuggestedNextFloor(dong, type, sheetKey){
  const candidates = entries.filter(e =>
    e.dong === dong && e.type === type && (type === 'install' || e.sheetKey === sheetKey)
  );
  if(candidates.length === 0) return null;
  // entries는 최신순(unshift)으로 쌓이므로 첫 항목이 가장 최근
  const mostRecent = candidates[0];
  return String(Number(mostRecent.floor) + 1);
}

sheetSel.addEventListener('change', () => {
  if(currentType === 'dismantle'){
    populateFloorChips();
    const suggested = getSuggestedNextFloor(dongSel.value, 'dismantle', sheetSel.value);
    if(suggested && floorChipsEl.querySelector(`.floor-chip[data-floor="${suggested}"]`)){
      selectedFloors = new Set([suggested]);
      populateFloorChips();
    }
  }
  updateBreakdown();
});

dongSel.addEventListener('change', () => {
  populateFloors();
  applyRulePrice();
  if(currentType === 'install'){
    const suggested = getSuggestedNextFloor(dongSel.value, 'install');
    if(suggested && [...floorSel.options].some(o => o.value === suggested)){
      floorSel.value = suggested;
    }
  }
  if(currentType === 'dismantle'){
    populateFloorChips();
    const suggested = getSuggestedNextFloor(dongSel.value, 'dismantle', sheetSel.value);
    if(suggested && floorChipsEl.querySelector(`.floor-chip[data-floor="${suggested}"]`)){
      selectedFloors = new Set([suggested]);
      populateFloorChips();
    }
  }
  updateBreakdown();
});
floorSel.addEventListener('change', updateBreakdown);
priceInput.addEventListener('input', () => {
  priceManuallyEdited = true;
  updateBreakdown();
});

// ---- 층 드래그 다중 선택 (해체 모드) ----
let dragActive = false;
let dragSelectMode = true; // true = 선택 중, false = 해제 중

function setChipState(chipEl, selected){
  const f = chipEl.dataset.floor;
  if(selected){ selectedFloors.add(f); chipEl.classList.add('selected'); }
  else { selectedFloors.delete(f); chipEl.classList.remove('selected'); }
}

floorChipsEl.addEventListener('pointerdown', (ev) => {
  const chip = ev.target.closest('.floor-chip');
  if(!chip || !chip.dataset.floor) return;
  ev.preventDefault();
  dragActive = true;
  dragSelectMode = !chip.classList.contains('selected');
  setChipState(chip, dragSelectMode);
  updateBreakdown();
});

document.addEventListener('pointermove', (ev) => {
  if(!dragActive) return;
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const chip = el && el.closest ? el.closest('.floor-chip') : null;
  if(chip && chip.dataset.floor && floorChipsEl.contains(chip)){
    if(chip.classList.contains('selected') !== dragSelectMode){
      setChipState(chip, dragSelectMode);
      updateBreakdown();
    }
  }
});

document.addEventListener('pointerup', () => { dragActive = false; });
document.addEventListener('pointercancel', () => { dragActive = false; });

// ---- storage-backed log (JSONBin.io) ----
let entries = [];
const JSONBIN_BIN_ID = '6a81c64eda38895dfeeb85fd';
const JSONBIN_API_KEY = '$2a$10$qyZUUO.S8EXC9KuX2iE1QutrHwoBmtfockunTzmY4ZsHTN2VvMTue';
const JSONBIN_BASE = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

async function loadEntries(){
  try{
    const res = await fetch(`${JSONBIN_BASE}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    const data = await res.json();
    entries = (data && data.record && Array.isArray(data.record.entries)) ? data.record.entries : [];
  }catch(e){
    entries = [];
  }
  renderLog();
}

async function saveEntries(){
  try{
    await fetch(JSONBIN_BASE, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify({ entries })
    });
  }catch(e){ /* best effort */ }
}

function mdLabel(dateStr){
  if(!dateStr) return '날짜 미기재';
  const parts = dateStr.split('-');
  if(parts.length === 3) return `${Number(parts[1])}/${Number(parts[2])}`;
  return dateStr;
}

function typeLabel(t){ return t === 'dismantle' ? '해체' : '설치'; }

function renderMonthSummary(){
  const summaryEl = document.getElementById('month-summary');
  if(entries.length === 0){
    summaryEl.style.display = 'none';
    summaryEl.innerHTML = '';
    return;
  }
  const groups = {};
  entries.forEach(e => {
    const si = settlementInfo(e.date);
    const key = si ? si.key : '__nodate__';
    if(!groups[key]) groups[key] = { label: si ? si.label : '날짜 미기재', period: si ? si.period : '', sum: 0 };
    groups[key].sum += e.amount;
  });
  const keys = Object.keys(groups).sort();
  if(keys.length <= 1){
    summaryEl.style.display = 'none';
    summaryEl.innerHTML = '';
    return;
  }
  summaryEl.style.display = 'block';
  summaryEl.innerHTML = keys.map(k => {
    const g = groups[k];
    return `<div class="m-row">
      <span class="name">${g.label}${g.period ? `<span class="period">(${g.period})</span>` : ''}</span>
      <span class="amt">${fmtWon(g.sum)}</span>
    </div>`;
  }).join('');
}

function renderItemSummary(){
  const summaryEl = document.getElementById('item-summary');
  if(entries.length === 0){
    summaryEl.style.display = 'none';
    summaryEl.innerHTML = '';
    return;
  }
  const groups = {};
  const order = [];
  entries.forEach(e => {
    const key = e.sheetTitle;
    if(!groups[key]){ groups[key] = { install: 0, dismantle: 0, sum: 0 }; order.push(key); }
    groups[key][e.type === 'dismantle' ? 'dismantle' : 'install'] += e.amount;
    groups[key].sum += e.amount;
  });
  const grandTotal = entries.reduce((s,e)=>s+e.amount, 0);
  summaryEl.style.display = 'block';
  summaryEl.innerHTML =
    `<div class="m-row" style="border-bottom:1px solid #ddd6c3;padding-bottom:8px;margin-bottom:2px;"><span class="name" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;">항목별 소계</span></div>` +
    order.map(k => {
      const g = groups[k];
      const detail = (g.install > 0 && g.dismantle > 0)
        ? `<span class="period">(설치 ${fmtWon(g.install)} · 해체 ${fmtWon(g.dismantle)})</span>` : '';
      return `<div class="m-row"><span class="name">${k} ${detail}</span><span class="amt">${fmtWon(g.sum)}</span></div>`;
    }).join('') +
    `<div class="m-row" style="border-top:2px solid var(--orange);margin-top:2px;padding-top:10px;"><span class="name" style="font-size:13.5px;">총합계</span><span class="amt" style="font-size:15px;">${fmtWon(grandTotal)}</span></div>`;
}

function renderLog(){
  if(entries.length === 0){
    logList.innerHTML = `<div class="empty-state">아직 추가된 작업이 없습니다.</div>`;
  } else {
    // 1) 설치/해체로 먼저 구분, 2) 그 안에서 항목(시트)별로 그룹핑
    const renderTypeSection = (type, label) => {
      const typeEntries = [];
      entries.forEach((e, i) => { if(e.type === type || (type==='install' && e.type !== 'dismantle')) typeEntries.push({e, i}); });
      if(typeEntries.length === 0) return '';

      const groups = {};
      typeEntries.forEach(({e, i}) => {
        const key = e.sheetTitle;
        if(!groups[key]) groups[key] = [];
        groups[key].push({ e, i });
      });
      const knownOrder = sheetKeys.map(k => shortTitle(k)).filter(t => groups[t]);
      const otherOrder = Object.keys(groups).filter(t => !knownOrder.includes(t));
      const order = [...knownOrder, ...otherOrder];

      const itemsHtml = order.map(title => {
        const rows = groups[title];
        const subtotal = rows.reduce((s, r) => s + r.e.amount, 0);
        const rowsHtml = rows.map(({e, i}) => {
          const si = settlementInfo(e.date);
          return `
          <div class="entry">
            <div class="info">
              <div class="line1">
                <span class="dt">${mdLabel(e.date)}</span>
                ${si ? `<span class="month-badge">${si.label} 시공</span>` : ''}
                <span>${e.dong}동 ${e.floor}층</span>
              </div>
              <div class="line2">${fmt(e.area)}m² × ${e.price.toLocaleString('ko-KR')}원</div>
            </div>
            <div class="amt">${fmtWon(e.amount)}</div>
            <button class="del" data-idx="${i}" title="삭제">✕</button>
          </div>`;
        }).join('');
        return `<div class="group-header">${title}</div>${rowsHtml}<div class="group-subtotal"><span class="label">${title} 소계</span><span class="amt">${fmtWon(subtotal)}</span></div>`;
      }).join('');

      const sectionTotal = typeEntries.reduce((s, {e}) => s + e.amount, 0);
      const dotClass = type === 'dismantle' ? ' dismantle' : '';
      return `<div class="type-section-header${dotClass}"><span class="dot"></span>${label}</div>${itemsHtml}<div class="type-section-total"><span class="label">${label} 합계</span><span class="amt">${fmtWon(sectionTotal)}</span></div>`;
    };

    logList.innerHTML = renderTypeSection('install', '설치') + renderTypeSection('dismantle', '해체');
  }
  const total = entries.reduce((s,e)=>s+e.amount, 0);
  totalValue.textContent = fmtWon(total);
  exportBtn.disabled = entries.length === 0;
  renderMonthSummary();
  renderItemSummary();
  if(currentType === 'install') populateFloors();
  if(currentType === 'dismantle') populateFloorChips();
}

logList.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.del');
  if(!btn) return;
  if(!confirm('삭제하시겠습니까?')) return;
  const idx = Number(btn.dataset.idx);
  entries.splice(idx, 1);
  renderLog();
  saveEntries();
});

clearBtn.addEventListener('click', () => {
  if(entries.length === 0) return;
  if(confirm('시공 목록을 모두 삭제할까요?')){
    entries = [];
    renderLog();
    saveEntries();
  }
});

function exportToExcel(){
  if(entries.length === 0 || typeof XLSX === 'undefined') return;

  const rows = entries.map(e => {
    const si = settlementInfo(e.date);
    return {
      '날짜': e.date || '',
      '시공월': si ? si.label : '',
      '구분': typeLabel(e.type),
      '동': e.dong + '동',
      '층': e.floor + '층',
      '항목': e.sheetTitle,
      '면적(m²)': Number(e.area.toFixed(2)),
      '단가(원)': e.price,
      '금액(원)': Math.round(e.amount)
    };
  });

  const total = entries.reduce((s,e)=>s+e.amount, 0);
  rows.push({ '날짜':'', '시공월':'', '구분':'', '동':'', '층':'', '항목':'합계', '면적(m²)':'', '단가(원)':'', '금액(원)': Math.round(total) });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [ {wch:11}, {wch:8}, {wch:6}, {wch:7}, {wch:7}, {wch:22}, {wch:11}, {wch:10}, {wch:12} ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '시공목록');

  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `대방수원2차_시공목록_${today}.xlsx`);
}

exportBtn.addEventListener('click', exportToExcel);

addBtn.addEventListener('click', () => {
  const items = currentItems().filter(it => it.area !== null);
  if(items.length === 0) return;
  const price = Number(priceInput.value) || 0;
  const date = dateInput.value;
  const dong = dongSel.value;
  const type = currentType;

  if(type === 'install'){
    const floor = floorSel.value;
    const existingDate = getInstallDate(dong, floor);
    if(existingDate){
      const proceed = confirm(`${dong}동 ${floor}층은 이미 ${mdLabel(existingDate)}에 설치 등록되어 있습니다.\n그래도 추가하시겠습니까?`);
      if(!proceed) return;
    }
  }

  items.forEach(it => {
    entries.unshift({
      date, type, sheetKey: it.key, sheetTitle: it.title,
      dong, floor: it.floor, area: it.area, price,
      amount: it.area * price
    });
  });
  renderLog();
  saveEntries();
  if(type === 'dismantle'){
    selectedFloors = new Set();
    populateFloorChips();
    updateBreakdown();
  }
});

populateDongs();

populateSheetOptions();

updateBreakdown();
loadEntries();

dateInput.value = today.toISOString().slice(0,10);
